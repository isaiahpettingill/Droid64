plugins {
    id 'com.android.application'
}

android {
    namespace 'org.codewiz.droid64'
    compileSdk Integer.parseInt(findProperty('androidCompileSdk') ?: '35')
    ndkVersion '27.2.12479018'

    signingConfigs {
        if (System.getenv('DROID64_KEYSTORE')) {
            release {
                storeFile file(System.getenv('DROID64_KEYSTORE'))
                storePassword System.getenv('DROID64_STORE_PASSWORD')
                keyAlias System.getenv('DROID64_KEY_ALIAS')
                keyPassword System.getenv('DROID64_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId 'org.codewiz.droid64'
        minSdk 21
        targetSdk 35
        versionCode 11000 + Integer.parseInt(findProperty('androidCompileSdk') ?: '35')
        versionName '1.1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild {
            cmake { cppFlags '-frtti -fexceptions' }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('DROID64_KEYSTORE')) signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake { path 'CMakeLists.txt'; version '3.22.1' }
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:support-v4:28.0.0'
}
